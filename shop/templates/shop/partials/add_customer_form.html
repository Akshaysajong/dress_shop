<form hx-post="{% url 'shop:add_customer' %}" 
      hx-target="#addCustomerModal .modal-body" 
      hx-swap="innerHTML">
    {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endif %}
    
    <div class="mb-3">
        <label for="name" class="form-label">
            <i class="fas fa-user me-1"></i>Customer Name <span class="text-danger">*</span>
        </label>
        <input type="text" 
               class="form-control" 
               id="name" 
               name="name" 
               required 
               placeholder="Enter customer name">
    </div>
    
    <div class="mb-3">
        <label for="phone" class="form-label">
            <i class="fas fa-phone me-1"></i>Phone Number <span class="text-danger">*</span>
        </label>
        <input type="tel" 
               class="form-control" 
               id="phone" 
               name="phone" 
               required 
               placeholder="Enter phone number"
               pattern="[0-9]{10}"
               title="Please enter a valid 10-digit phone number">
    </div>
    
    <div class="mb-3">
        <label for="email" class="form-label">
            <i class="fas fa-envelope me-1"></i>Email Address
        </label>
        <input type="email" 
               class="form-control" 
               id="email" 
               name="email" 
               placeholder="Enter email address (optional)">
    </div>
    
    <div class="mb-3">
        <label for="address" class="form-label">
            <i class="fas fa-map-marker-alt me-1"></i>Address
        </label>
        <textarea class="form-control" 
                  id="address" 
                  name="address" 
                  rows="3" 
                  placeholder="Enter customer address (optional)"></textarea>
    </div>
    
    <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-2"></i>Cancel
        </button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i>Add Customer
        </button>
    </div>
</form>

<script>
    // Auto-focus on name field when modal is shown
    document.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.target.id === 'addCustomerModal' || evt.detail.target.classList.contains('modal-body')) {
            const nameInput = document.getElementById('name');
            if (nameInput) {
                nameInput.focus();
            }
        }
    });
</script>
