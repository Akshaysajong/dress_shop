services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn dress_shop.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 2"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=dress_shop.settings
    restart: unless-stopped

  celery:
    build: .
    command: celery -A dress_shop worker -l info
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=dress_shop.settings
    restart: unless-stopped

  celery-beat:
    build: .
    # Temporarily disabled to avoid django_celery_beat dependency issues
    command: tail -f /dev/null
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=dress_shop.settings
    restart: unless-stopped

volumes:
  redis_data:
